# Authentication lab suite — teacher configuration
# Ports: lab01..lab06 = 8101..8106 (loopback + tailnet node only)
# Network: external bridge `lab_net` (10.10.0.0/24); static IPs 10.10.0.50-55
#   docker network create --driver bridge --subnet 10.10.0.0/24 --gateway 10.10.0.1 lab_net
networks:
  lab_net:
    external: true

services:
  lab01-username-enum-different:
    build:
      context: .
      dockerfile: labs/01-username-enum-different/Dockerfile
    ports: ["127.0.0.1:8101:80", "100.99.154.48:8101:80"]
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 10.10.0.50

  lab02-username-enum-subtle:
    build:
      context: .
      dockerfile: labs/02-username-enum-subtle/Dockerfile
    ports: ["127.0.0.1:8102:80", "100.99.154.48:8102:80"]
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 10.10.0.51

  lab03-username-enum-timing:
    build:
      context: .
      dockerfile: labs/03-username-enum-timing/Dockerfile
    ports: ["127.0.0.1:8103:80", "100.99.154.48:8103:80"]
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 10.10.0.52

  lab04-bruteforce-ip-block:
    build:
      context: .
      dockerfile: labs/04-bruteforce-ip-block/Dockerfile
    ports: ["127.0.0.1:8104:80", "100.99.154.48:8104:80"]
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 10.10.0.53

  lab05-username-enum-account-lock:
    build:
      context: .
      dockerfile: labs/05-username-enum-account-lock/Dockerfile
    ports: ["127.0.0.1:8105:80", "100.99.154.48:8105:80"]
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 10.10.0.54

  lab06-bruteforce-multi-credential:
    build:
      context: .
      dockerfile: labs/06-bruteforce-multi-credential/Dockerfile
    ports: ["127.0.0.1:8106:80", "100.99.154.48:8106:80"]
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 10.10.0.55